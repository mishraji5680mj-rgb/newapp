.tdy{position:relative;z-index:2;margin:-76px 0 14px;padding:2px;border-radius:24px;background:linear-gradient(135deg,#F2A31B,#FFE6AA 38%,#D9650F 68%,#F2A31B);box-shadow:0 18px 38px -14px rgba(74,16,16,.6)}

.tdy-in::before{content:"";position:absolute;left:-90px;top:50%;width:420px;height:420px;margin-top:-210px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(242,163,27,.16) 0 7deg,transparent 7deg 15deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 68%);mask:radial-gradient(circle,#000 18%,transparent 68%);animation:tdspin 60s linear infinite;pointer-events:none}
.tdy-img{position:relative;width:140px;height:140px;flex:none}

.tdy-img img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid #F2A31B;box-shadow:0 0 0 7px rgba(242,163,27,.16),0 0 38px rgba(242,163,27,.5);animation:tdglow 3.6s ease-in-out infinite}

.tdy-m{font:1.25rem/1.4 "Tiro Devanagari Hindi",serif;color:#F2A31B;margin:6px 0 0}

.tdy-b{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.tdy-a{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 30px;border:0;border-radius:99px;cursor:pointer;font:600 1.15rem/1.2 "Mukta",system-ui,sans-serif;color:#4A1010;background:linear-gradient(180deg,#FFD672 0%,#F2A31B 55%,#DB8A10 100%);box-shadow:0 5px 0 #8F5405,0 12px 24px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .12s,box-shadow .12s}
.tdy-a:hover{transform:translateY(-2px);box-shadow:0 7px 0 #8F5405,0 16px 28px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.tdy-a:active{transform:translateY(4px);box-shadow:0 1px 0 #8F5405,0 4px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.tdy-a::after{content:"";position:absolute;top:0;bottom:0;width:46px;left:-70px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-18deg);animation:tdshine 3.8s ease-in-out infinite}

@keyframes tdspin{to{transform:rotate(360deg)}}

var AARTI=["जय गणेश जय गणेश, जय गणेश देवा।\nमाता जाकी पार्वती, पिता महादेवा॥\n\nएक दंत दयावंत, चार भुजा धारी।\nमाथे सिंदूर सोहे, मूसे की सवारी॥\n(जय गणेश जय गणेश, जय गणेश देवा...)\n\nपान चढ़े फूल चढ़े, और चढ़े मेवा।\nलड्डुअन का भोग लगे, संत करें सेवा॥\n(जय गणेश जय गणेश, जय गणेश देवा...)\n\nअंधन को आँख देत, कोढ़िन को काया।\nबाँझन को पुत्र देत, निर्धन को माया॥\n(जय गणेश जय गणेश, जय गणेश देवा...)\n\n'सूरश्याम' शरण आए, सफल कीजे सेवा।\nमाता जाकी पार्वती, पिता महादेवा॥\nजय गणेश जय गणेश, जय गणेश देवा॥", "ॐ जय शिव ओंकारा, स्वामी जय शिव ओंकारा।\nब्रह्मा विष्णु सदाशिव, अर्द्धांगी धारा॥\nॐ हर हर हर महादेव॥\n\nएकानन चतुरानन पंचानन राजे।\nहंसानन गरुड़ासन वृषवाहन साजे॥\nॐ हर हर हर महादेव॥\n\nदो भुज चार चतुर्भुज दसभुज अति सोहे।\nतीनों रूप निरखते त्रिभुवन जन मोहे॥\nॐ हर हर हर महादेव॥\n\nअक्षमाला वनमाला मुंडमाला धारी।\nचंदन मृगमद सोहे भोले शशिधारी॥\nॐ हर हर हर महादेव॥\n\nश्वेतांबर पीतांबर बाघंबर अंगे।\nसनकादिक गरुड़ादिक भूतादिक संगे॥\nॐ हर हर हर महादेव॥\n\nकर के मध्य कमंडलु चक्र त्रिशूलधारी।\nसुखकारी दुखहारी जगपालन कारी॥\nॐ हर हर हर महादेव॥\n\nब्रह्मा विष्णु सदाशिव जानत अविवेका।\nप्रणवाक्षर के मध्ये ये तीनों एका॥\nॐ हर हर हर महादेव॥\n\nत्रिगुण स्वामी जी की आरती जो कोई नर गावे।\nकहत शिवानंद स्वामी मनवांछित फल पावे॥\nॐ जय शिव ओंकारा॥", "ॐ जय जगदीश हरे, स्वामी जय जगदीश हरे।\nभक्त जनों के संकट, दास जनों के संकट, क्षण में दूर करे॥\nॐ जय जगदीश हरे॥\n\nजो ध्यावे फल पावे, दुख बिनसे मन का।\nसुख संपत्ति घर आवे, कष्ट मिटे तन का॥\nॐ जय जगदीश हरे॥\n\nमात-पिता तुम मेरे, शरण गहूँ मैं किसकी।\nतुम बिन और न दूजा, आस करूँ मैं जिसकी॥\nॐ जय जगदीश हरे॥\n\nतुम पूरण परमात्मा, तुम अंतर्यामी।\nपारब्रह्म परमेश्वर, तुम सबके स्वामी॥\nॐ जय जगदीश हरे॥\n\nतुम करुणा के सागर, तुम पालन-कर्ता।\nमैं मूरख खल कामी, कृपा करो भर्ता॥\nॐ जय जगदीश हरे॥\n\nतुम हो एक अगोचर, सबके प्राणपति।\nकिस विधि मिलूँ दयामय, तुमको मैं कुमति॥\nॐ जय जगदीश हरे॥\n\nदीनबंधु दुखहर्ता, तुम रक्षक मेरे।\nकरुणा हस्त बढ़ाओ, द्वार पड़ा तेरे॥\nॐ जय जगदीश हरे॥\n\nविषय-विकार मिटाओ, पाप हरो देवा।\nश्रद्धा भक्ति बढ़ाओ, संतन की सेवा॥\nॐ जय जगदीश हरे॥", "आरती कीजै हनुमान लला की।\nदुष्ट दलन रघुनाथ कला की॥\n\nजाके बल से गिरिवर काँपे।\nरोग दोष जाके निकट न झाँके॥\nआरती कीजै हनुमान लला की॥\n\nअंजनि पुत्र महा बलदाई।\nसंतन के प्रभु सदा सहाई॥\nआरती कीजै हनुमान लला की॥\n\nदे बीड़ा रघुनाथ पठाए।\nलंका जारि सिया सुधि लाए॥\nआरती कीजै हनुमान लला की॥\n\nलंका सो कोट समुद्र सी खाई।\nजात पवनसुत बार न लाई॥\nआरती कीजै हनुमान लला की॥\n\nलंका जारि असुर संहारे।\nसियारामजी के काज सँवारे॥\nआरती कीजै हनुमान लला की॥\n\nलक्ष्मण मूर्छित पड़े सकारे।\nआनि संजीवन प्राण उबारे॥\nआरती कीजै हनुमान लला की॥\n\nपैठि पाताल तोरि यम-कारे।\nअहिरावण की भुजा उखारे॥\nआरती कीजै हनुमान लला की॥\n\nबाएँ भुजा असुर दल मारे।\nदाहिने भुजा संतजन तारे॥\nआरती कीजै हनुमान लला की॥\n\nसुर नर मुनि आरती उतारें।\nजय जय जय हनुमान उचारें॥\nआरती कीजै हनुमान लला की॥\n\nकंचन थार कपूर लौ छाई।\nआरती करत अंजना माई॥\nआरती कीजै हनुमान लला की॥\n\nजो हनुमानजी की आरती गावै।\nबसि बैकुंठ परमपद पावै॥\nआरती कीजै हनुमान लला की॥", "ॐ जय लक्ष्मी माता, मैया जय लक्ष्मी माता।\nतुमको निशिदिन सेवत, हर विष्णु विधाता॥\nॐ जय लक्ष्मी माता॥\n\nउमा रमा ब्रह्माणी, तुम ही जग माता।\nसूर्य चंद्रमा ध्यावत, नारद ऋषि गाता॥\nॐ जय लक्ष्मी माता॥\n\nदुर्गा रूप निरंजनी, सुख संपत्ति दाता।\nजो कोई तुमको ध्यावत, ऋद्धि सिद्धि धन पाता॥\nॐ जय लक्ष्मी माता॥\n\nतुम पाताल निवासिनी, तुम ही शुभदाता।\nकर्म प्रभाव प्रकाशिनी, भवनिधि की त्राता॥\nॐ जय लक्ष्मी माता॥\n\nजिस घर में तुम रहती, तहँ सब सद्गुण आता।\nसब संभव हो जाता, मन नहीं घबराता॥\nॐ जय लक्ष्मी माता॥\n\nतुम बिन यज्ञ न होते, वस्त्र न कोई पाता।\nखान पान का वैभव, सब तुमसे आता॥\nॐ जय लक्ष्मी माता॥\n\nशुभ गुण मन्दिर सुंदर, क्षीरोदधि जाता।\nरत्न चतुर्दश तुम बिन, कोई नहीं पाता॥\nॐ जय लक्ष्मी माता॥\n\nमहालक्ष्मी जी की आरती, जो कोई नर गाता।\nउर आनंद समाता, पाप उतर जाता॥\nॐ जय लक्ष्मी माता॥", "जय अम्बे गौरी, मैया जय श्यामा गौरी।\nतुमको निशदिन ध्यावत, हरि ब्रह्मा शिवरी॥\nॐ जय अम्बे गौरी॥\n\nमाँग सिंदूर विराजत, टीको मृगमद को।\nउज्ज्वल से दोउ नैना, चंद्रवदन नीको॥\nॐ जय अम्बे गौरी॥\n\nकनक समान कलेवर, रक्ताम्बर राजै।\nरक्तपुष्प गल माला, कंठन पर साजै॥\nॐ जय अम्बे गौरी॥\n\nकेहरि वाहन राजत, खड्ग खप्पर धारी।\nसुर-नर-मुनिजन सेवत, तिनके दुखहारी॥\nॐ जय अम्बे गौरी॥\n\nकानन कुंडल शोभित, नासाग्रे मोती।\nकोटिक चंद्र दिवाकर, राजत सम ज्योती॥\nॐ जय अम्बे गौरी॥\n\nशुंभ निशुंभ बिदारे, महिषासुर घाती।\nधूम्र विलोचन नैना, निशदिन मदमाती॥\nॐ जय अम्बे गौरी॥\n\nचंड मुंड संहारे, शोणित बीज हरे।\nमधु कैटभ दोउ मारे, सुर भयहीन करे॥\nॐ जय अम्बे गौरी॥\n\nब्रह्माणी रुद्राणी तुम कमला रानी।\nआगम निगम बखानी, तुम शिव पटरानी॥\nॐ जय अम्बे गौरी॥\n\nचौंसठ योगिनी गावत, नृत्य करत भैरूँ।\nबाजत ताल मृदंगा, अरु बाजत डमरू॥\nॐ जय अम्बे गौरी॥\n\nतुम ही जग की माता, तुम ही हो भरता।\nभक्तन की दुख हरता, सुख संपत्ति करता॥\nॐ जय अम्बे गौरी॥\n\nभुजा चार अति शोभित, वर मुद्रा धारी।\nमनवांछित फल पावत, सेवत नर नारी॥\nॐ जय अम्बे गौरी॥\n\nकंचन थाल विराजत, अगर कपूर बाती।\nश्रीमालकेतु में राजत, कोटि रतन ज्योती॥\nॐ जय अम्बे गौरी॥\n\nश्री अम्बे जी की आरती, जो कोई नर गावे।\nकहत शिवानंद स्वामी, सुख संपत्ति पावे॥\nॐ जय अम्बे गौरी॥", "आरती कुंज बिहारी की, श्री गिरधर कृष्ण मुरारी की॥\n\nगले में बैजंती माला, बजावै मुरली मधुर बाला।\nश्रवण में कुंडल झलकाला, नंद के आनंद नंदलाला।\nगगन सम अंग कांति काली, राधिका चमक रही आली।\nलतन में ठाढ़े बनमाली, भ्रमर सी अलक, कस्तूरी तिलक,\nचंद्र सी झलक, ललित छवि श्यामा प्यारी की॥\nआरती कुंज बिहारी की, श्री गिरधर कृष्ण मुरारी की॥\n\nकनकमय मोर मुकुट बिलसै, देवता दरसन को तरसैं।\nगगन सों सुमन रासि बरसै, बजे मुरचंग, मधुर मृदंग,\nग्वालिन संग, अतुल रति गोप कुमारी की॥\nआरती कुंज बिहारी की, श्री गिरधर कृष्ण मुरारी की॥\n\nजहाँ ते प्रकट भई गंगा, कलुष कलि हारिणि श्री गंगा।\nस्मरन ते होत मोह भंगा, बसी शिव सीस, जटा के बीच,\nहरै अघ कीच, चरन छवि श्री बनवारी की॥\nआरती कुंज बिहारी की, श्री गिरधर कृष्ण मुरारी की॥\n\nचमकती उज्ज्वल तट रेनू, बज रही वृंदावन बेनू।\nचहुँ दिशि गोपि ग्वाल धेनू, हँसत मृदु मंद, चाँदनी चंद,\nकटत भव फंद, टेर सुन दीन दुखारी की॥\nआरती कुंज बिहारी की, श्री गिरधर कृष्ण मुरारी की॥", "जय कश्यप-नन्दन, ॐ जय अदिति नन्दन।\nत्रिभुवन-तिमिर-निकन्दन, भक्त-हृदय-चन्दन॥\nॐ जय कश्यप-नन्दन॥\n\nसप्त-अश्व रथ राजित, एक चक्रधारी।\nदुखहारी, सुखकारी, मानस-मल-हारी॥\nॐ जय कश्यप-नन्दन॥\n\nसुर-मुनि-भूसुर-वन्दित, विमल विभवशाली।\nअघ-दल-दलन दिवाकर, दिव्य किरण माली॥\nॐ जय कश्यप-नन्दन॥\n\nसकल-सुकर्म-प्रसविता, सविता शुभकारी।\nविश्व-विलोचन मोचन, भव-बन्धन भारी॥\nॐ जय कश्यप-नन्दन॥\n\nकमल-समूह विकासक, नाशक त्रय तापा।\nसेवत साहज हरत अति, मनसिज संतापा॥\nॐ जय कश्यप-नन्दन॥\n\nनेत्र-व्याधि हर सुरवर, भू-पीड़ा-हारी।\nवृष्टि विमोचन संतत, परहित व्रतधारी॥\nॐ जय कश्यप-नन्दन॥\n\nसूर्यदेव करुणाकर, अब करुणा कीजै।\nहर अज्ञान-मोह सब, तत्त्वज्ञान दीजै॥\nॐ जय कश्यप-नन्दन॥"];

<script>
/* ===== Back button: one screen at a time, press twice at home to exit ===== */
(function(){
 if(!window.history||!history.pushState||!window.show)return;
 var LY=[],Q=[],qb=false,qt=0,armed=false,guardOn=false,armT=0,tt=0;

 try{if(history.state&&typeof history.state.ly==="number")history.replaceState({base:1},"");else if(!history.state)history.replaceState({base:1},"")}catch(e){}
 function inLY(n){return LY.indexOf(n)>=0}
 function qrun(){
  if(qb||!Q.length)return;
  var o=Q.shift();
  if(o.t==="p"){try{history.pushState({ly:o.d},"")}catch(e){}qrun()}
  else{qb=true;clearTimeout(qt);qt=setTimeout(function(){qb=false;qrun()},800);try{history.go(-o.n)}catch(e){qb=false}}
 }
 function ensureGuard(){if(guardOn)return;guardOn=true;armed=false;try{history.pushState({ly:0},"")}catch(e){}}
 function lyPush(n){if(inLY(n))return;ensureGuard();LY.push(n);Q.push({t:"p",d:LY.length});qrun()}
 function lyDrop(n){var i=LY.lastIndexOf(n);if(i<0)return;var c=LY.length-i;LY.splice(i,c);Q.push({t:"b",n:c});qrun()}
 function closeLayer(n){try{
  if(n==="dev")closeDev();else if(n==="ch")closeCh();else if(n==="jap"){closeJap();render()}
  else if(n==="reel")rClose();else if(n==="bk"){document.getElementById("bkv").hidden=true;document.getElementById("bkf").srcdoc=""}

   d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:10000;padding:10px 18px;border-radius:22px;background:rgba(40,16,12,.92);color:#fff;font:.95rem/1.3 inherit;max-width:88vw;text-align:center;pointer-events:none";

 var mo=new MutationObserver(function(ms){ms.forEach(function(m){var el=m.target;for(var k in OB){if(OB[k]===el.id){if(el.hidden)lyDrop(k);else lyPush(k)}}})});

 window.show=function(v){_show(v);if(v!=="panchang")lyPush("tab");else lyDrop("tab")};

 ["pointerdown","keydown","touchstart"].forEach(function(t){document.addEventListener(t,ensureGuard,{capture:true,once:true,passive:true})});
 window.__ly=LY;
 window.LYAPI={push:lyPush,drop:lyDrop,has:inLY,close:{}};
})();

k:"Devi Parvati kept Somvar fasts to have Shiv as her husband. The vrat is kept for a good life partner, peace at home and health.|देवी पार्वती ने शिव जी को पति रूप में पाने के लिए सोमवार व्रत किए। यह व्रत अच्छे जीवनसाथी, घर में शांति और स्वास्थ्य के लिए रखा जाता है।",
p:"In the evening after puja, with fruit or one satvik meal.|शाम को पूजा के बाद फलाहार या एक सात्विक भोजन से।"},
{i:"🚩",n:"Mangalvar Vrat|मंगलवार व्रत",d:"Hanuman ji|हनुमान जी",w:"Every Tuesday|हर मंगलवार",m:3,
s:["Bath, wear red clothes and take sankalp.|स्नान करें, लाल वस्त्र पहनें और संकल्प लें।","Offer sindoor mixed in chameli oil, red flowers and gud-chana or laddu to Hanuman ji.|हनुमान जी को चमेली के तेल में सिंदूर, लाल फूल और गुड़-चना या लड्डू चढ़ाएँ।","Recite Hanuman Chalisa and Sundarkand (or Bajrang Baan).|हनुमान चालीसा और सुंदरकांड (या बजरंग बाण) का पाठ करें।","Aarti, give prasad, one meal in the evening.|आरती करें, प्रसाद बाँटें, शाम को एक समय भोजन।"],
r:"One satvik meal; brahmacharya; no non-veg or alcohol.|एक सात्विक भोजन; ब्रह्मचर्य; मांस-मदिरा नहीं।",
k:"Hanuman ji brought the Sanjeevani for Lakshman and is called Sankatmochan. The vrat is kept for courage, protection and relief from troubles.|हनुमान जी लक्ष्मण जी के लिए संजीवनी लाए और संकटमोचन कहलाते हैं। यह व्रत साहस, रक्षा और संकट निवारण के लिए रखा जाता है।",
p:"In the evening after Hanuman puja: prasad first, then one satvik meal.|शाम को हनुमान पूजा के बाद: पहले प्रसाद, फिर एक सात्विक भोजन।"},
{i:"🌼",n:"Guruvar Vrat|गुरुवार व्रत",d:"Bhagwan Vishnu · Brihaspati|भगवान विष्णु · बृहस्पति देव",w:"Every Thursday|हर गुरुवार",m:2,
s:["Bath, wear yellow clothes; worship Vishnu ji and Brihaspati Dev.|स्नान करें, पीले वस्त्र पहनें; विष्णु जी और बृहस्पति देव की पूजा करें।","Offer chana dal, gud, yellow flowers, banana and haldi.|चना दाल, गुड़, पीले फूल, केला और हल्दी चढ़ाएँ।","Water the banana plant and light a ghee diya; read the Brihaspativar katha.|केले के पौधे में जल दें और घी का दीपक जलाएँ; बृहस्पतिवार कथा पढ़ें।","Aarti and prasad; one meal of yellow food (chana, besan).|आरती और प्रसाद; एक समय पीला भोजन (चना, बेसन)।"],
r:"By tradition: no salt, do not wash hair or cut hair/nails; do not eat banana if you worship the plant.|परंपरा: नमक नहीं, बाल न धोएँ, बाल-नाखून न काटें; केले के पौधे की पूजा करें तो केला न खाएँ।",
k:"Brihaspati, guru of the devas, gives wisdom, marriage, children and wealth. The katha tells how a family regained its fortune by keeping the vrat with faith.|देवगुरु बृहस्पति ज्ञान, विवाह, संतान और धन देते हैं। कथा बताती है कि श्रद्धा से व्रत निभाने पर एक परिवार का भाग्य लौट आया।",
p:"In the evening after puja with one meal.|शाम को पूजा के बाद एक समय भोजन से।"},
{i:"🌑",n:"Shanivar Vrat|शनिवार व्रत",d:"Shani Dev · Hanuman ji|शनि देव · हनुमान जी",w:"Every Saturday|हर शनिवार",m:3,
s:["Bath and wear black or dark blue clothes; take sankalp.|स्नान कर काले या गहरे नीले वस्त्र पहनें; संकल्प लें।","Evening: light a sarson oil diya before Shani Dev or under a peepal tree.|शाम को शनि देव के सामने या पीपल के नीचे सरसों के तेल का दीया जलाएँ।","Chant Om Sham Shanaishcharaya Namah; read Shani or Hanuman Chalisa.|'ॐ शं शनैश्चराय नमः' जपें; शनि या हनुमान चालीसा पढ़ें।","Donate black sesame, urad, oil or iron; feed a dog or crow.|काले तिल, उड़द, तेल या लोहे का दान करें; कुत्ते या कौए को भोजन दें।"],
r:"One satvik meal. By tradition avoid buying iron on this day.|एक सात्विक भोजन। परंपरा अनुसार इस दिन लोहा खरीदने से बचें।",
k:"Shani Dev is the lord of karma and justice and gives fruit as per deeds. Hanuman bhakts are traditionally spared his harsh gaze.|शनि देव कर्म और न्याय के देवता हैं और कर्म के अनुसार फल देते हैं। परंपरा है कि हनुमान भक्तों पर उनकी कठोर दृष्टि नहीं पड़ती।",
p:"After the evening puja and daan, with one satvik meal.|शाम की पूजा और दान के बाद एक सात्विक भोजन से।"},
{i:"🦁",n:"Navratri|नवरात्रि",d:"Maa Durga|माँ दुर्गा",w:"Chaitra and Shardiya, 9 days|चैत्र और शारदीय, 9 दिन",m:5,
s:["Day 1: Ghatasthapana with kalash, jau and akhand jyot at the shubh muhurat.|पहले दिन शुभ मुहूर्त में कलश, जौ और अखंड ज्योत से घटस्थापना।","Daily puja of one Devi form (Shailputri to Siddhidatri); read Durga Saptashati or Chalisa.|रोज़ एक देवी स्वरूप की पूजा (शैलपुत्री से सिद्धिदात्री); दुर्गा सप्तशती या चालीसा पढ़ें।","Ashtami/Navami: havan and kanjak (nine girls and a boy) with halwa, puri and chana.|अष्टमी/नवमी: हवन और कन्या पूजन (नौ कन्याएँ और एक बालक), हलवा-पूरी-चने के साथ।","Dashami: visarjan and parna after puja.|दशमी: पूजा के बाद विसर्जन और पारण।"],
r:"Satvik; no onion, garlic, non-veg or alcohol; avoid cutting hair/nails; brahmacharya (as per custom).|सात्विक; प्याज-लहसुन, मांस-मदिरा नहीं; बाल-नाखून न काटें; ब्रह्मचर्य (परंपरा अनुसार)।",
k:"Maa Durga fought Mahishasura for nine nights and slew him on the tenth. Navratri celebrates the victory of shakti over evil.|माँ दुर्गा ने नौ रात महिषासुर से युद्ध किया और दसवें दिन उसका वध किया। नवरात्रि बुराई पर शक्ति की विजय का पर्व है।",
p:"On Dashami after puja (or after the Navami kanjak, as per family custom).|दशमी को पूजा के बाद (या परिवार की परंपरा अनुसार नवमी के कन्या पूजन के बाद)।"},
{i:"🕉️",n:"Mahashivratri|महाशिवरात्रि",d:"Bhagwan Shiv|भगवान शिव",w:"Phalgun Krishna Chaturdashi (once a year)|फाल्गुन कृष्ण चतुर्दशी (वर्ष में एक बार)",m:1,
s:["Fast the whole day; bathe and take sankalp in the morning.|पूरे दिन व्रत रखें; सुबह स्नान कर संकल्प लें।","Night puja in the four prahars: abhishek with water, milk, curd, honey and ghee each time.|रात के चारों प्रहर में जल, दूध, दही, शहद और घी से अभिषेक व पूजा।","Offer bel patra, dhatura and aak flowers; chant Om Namah Shivaya.|बेलपत्र, धतूरा और आक के फूल चढ़ाएँ; 'ॐ नमः शिवाय' जपें।","Night jagran with bhajan and Shiv katha.|भजन और शिव कथा के साथ रात्रि जागरण।"],
r:"Phalahar only, no grains; no tulsi for Shiv; stay awake and calm.|केवल फलाहार, अन्न नहीं; शिव जी को तुलसी न चढ़ाएँ; जागरण करें और शांत रहें।",
k:"On this night Shiv and Parvati were married. A hunter who unknowingly dropped bel leaves on a Shivling and stayed awake all night was freed from sin.|इसी रात शिव-पार्वती का विवाह हुआ। जिस शिकारी ने अनजाने में शिवलिंग पर बेलपत्र गिराए और रात भर जागा, उसे पापों से मुक्ति मिली।",
p:"Next morning after bath and puja, after sunrise. Ask Pandit ji for the exact window.|अगली सुबह सूर्योदय के बाद स्नान-पूजा करके। सही समय पंडित जी से पूछें।"}];

<script>
(function(){
var FS=[1,1.15,1.3,1.5],th="auto",fs=0,pend=null,R=document.documentElement;
try{var t=localStorage.getItem("th");if(t==="dark"||t==="light")th=t;fs=Math.max(0,Math.min(3,+localStorage.getItem("fs")||0))}catch(e){}
function frameCss(){return":root{--fs:"+FS[fs]+"}html{font-size:calc(16px*var(--fs))}body{font-size:calc(17px*var(--fs))}"+(th==="dark"?":root{--bg:#1C1210;--surface:#2A1B17;--ink:#F6EBDD;--muted:#C2AD9C;--line:#4A332B;color-scheme:dark}h2{color:var(--gold)}":th==="light"?":root{--bg:#FBF5EA;--surface:#fff;--ink:#2A1A14;--muted:#6E5A4E;--line:#E8D9BF;color-scheme:light}h2{color:var(--maroon)}":"")}
function apply(){
 if(th==="auto")delete R.dataset.theme;else R.dataset.theme=th;
 R.style.setProperty("--fs",FS[fs]);
 try{localStorage.setItem("th",th);localStorage.setItem("fs",fs)}catch(e){}
 var a=$("thb"),d=$("fsd"),u=$("fsu");if(!a)return;
 a.textContent=th==="dark"?L("🌙 Dark|🌙 डार्क"):th==="light"?L("☀️ Light|☀️ लाइट"):L("🌓 Auto|🌓 ऑटो");
 d.disabled=fs===0;u.disabled=fs===3;d.setAttribute("aria-label",L("Smaller text|छोटे अक्षर"));u.setAttribute("aria-label",L("Larger text|बड़े अक्षर"));
 var f=$("bkf");try{var dc=f.contentDocument;if(dc&&dc.head){var s=dc.getElementById("prefcss");if(!s){s=dc.createElement("style");s.id="prefcss";dc.head.appendChild(s)}s.textContent=frameCss()}}catch(e){}}
document.addEventListener("click",function(e){var b=e.target.closest("#thb,#fsd,#fsu");if(!b)return;
 if(b.id==="thb")th=th==="auto"?"dark":th==="dark"?"light":"auto";
 else if(b.id==="fsd")fs=Math.max(0,fs-1);else fs=Math.min(3,fs+1);
 apply()});
$("bkf").addEventListener("load",function(){
 apply();
 if(!pend)return;var p=pend;pend=null;
 try{var w=$("bkf").contentWindow,k=p.idx;
  if(k==null){var n=p.n.split("|");w.PUJAS.push([n[0],n[1]]);k=w.PUJAS.length-1;w.P.forEach(function(x){x.p.push(k)})}
  w.fillPuja();w.document.getElementById("puja").value=w.PUJAS[k][w.i()];
  w.document.getElementById("book").scrollIntoView()}catch(x){}});
window.bookPuja=function(n,idx){pend={n:n,idx:idx};$("bk").click()};
var _r=render;render=function(){_r();apply()};apply();
})();
</script>
<script src="bhajan-list.js"></script>
<script>
/* ---- Bhajan tab: swipe up / down video feed. Videos are listed in bhajan-list.js ---- */
(function(){
var sec=document.getElementById("bhajan"),host=document.getElementById("bjf");if(!sec||!host)return;
var list=(window.BHAJAN||[]).filter(function(x){return x&&x.src}),slides=[],act=-1,built=false,sound=true,lastIdx=0,io=null;
function navH(){var n=document.querySelector("nav.bt");if(n)document.documentElement.style.setProperty("--navh",n.offsetHeight+"px")}
navH();addEventListener("resize",navH);
window.BHAJAN_SET=function(dev,start){var all=(window.BHAJAN||[]).filter(function(x){return x&&x.src}),nl=(dev===null||dev===undefined)?all:all.filter(function(x){return x.dev===dev});
 if(!nl.length)return false;list=nl;built=false;act=-1;lastIdx=Math.max(0,Math.min(nl.length-1,start||0));if(io){io.disconnect();io=null}slides.forEach(function(s,k){var v=s.querySelector("video");if(v){v.pause();v.removeAttribute("src");v.load()}});slides=[];host.innerHTML="";return true};
function ttl(i){var t=list[i].title||"";return typeof L==="function"?L(t):t.split("|")[0]}
function build(){
 if(built)return;built=true;navH();
 if(!list.length){host.innerHTML='<div class="bjz">'+L("Bhajan videos are coming soon. 🙏|भजन के वीडियो जल्द ही आएँगे। 🙏")+'</div>';return}
 host.innerHTML=list.map(function(v,i){return '<div class="bj" data-i="'+i+'"><div class="bjw"><video playsinline webkit-playsinline loop preload="none"'+(v.poster?' poster="'+v.poster+'"':'')+'></video>'
  +'<div class="bje">'+L("This video could not be loaded.|यह वीडियो नहीं चल सका।")+'</div><div class="bjf"></div>'
  +'<div class="bjg"><div class="bjt"></div><div class="bjc">'+(i+1)+' / '+list.length+'</div></div>'
  +'<div class="bjs"><button type="button" data-bm="1" aria-label="Sound">🔊</button><button type="button" data-bs="1" aria-label="Share">📤</button></div>'
  +'<div class="bjh">'+(i===0?L("⬆️ Swipe up for next|⬆️ अगला देखने के लिए ऊपर स्वाइप करें"):"")+'</div>'
  +'<div class="bjp"><i></i></div></div></div>'}).join("")
  +'<div class="bjn"><button type="button" data-bn="-1" aria-label="Previous">▲</button><button type="button" data-bn="1" aria-label="Next">▼</button></div>';
 slides=[].slice.call(host.querySelectorAll(".bj"));
 slides.forEach(function(s,i){
  var v=s.querySelector("video"),w=s.querySelector(".bjw");
  v.addEventListener("loadedmetadata",function(){v.classList.toggle("ls",v.videoWidth>v.videoHeight)});
  v.addEventListener("timeupdate",function(){if(v.duration)s.querySelector(".bjp i").style.width=(v.currentTime/v.duration*100)+"%"});
  v.addEventListener("waiting",function(){w.classList.add("ld")});
  ["playing","canplay","pause"].forEach(function(e){v.addEventListener(e,function(){w.classList.remove("ld")})});
  v.addEventListener("error",function(){if(v.getAttribute("src")){w.classList.remove("ld");w.classList.add("er")}})});
 titles();
 io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>=.6)setActive(+e.target.dataset.i)})},{root:host,threshold:[.6]});
 slides.forEach(function(s){io.observe(s)});
}
function titles(){slides.forEach(function(s,i){s.querySelector(".bjt").textContent=ttl(i)})}
function vid(i){return slides[i]&&slides[i].querySelector("video")}
function load(i,pre){var v=vid(i);if(!v)return;if(!v.getAttribute("src")){v.preload=pre;v.src=list[i].src}}
function unload(i){var v=vid(i);if(!v)return;v.pause();if(v.getAttribute("src")){v.removeAttribute("src");v.load()}slides[i].querySelector(".bjw").classList.remove("er","ld")}
function setActive(i){
 if(i===act||!sec.classList.contains("on"))return;
 act=i;lastIdx=i;
 slides.forEach(function(s,k){var d=Math.abs(k-i);if(k!==i&&vid(k))vid(k).pause();if(d>2)unload(k)});
 load(i,"auto");load(i+1,"auto");load(i-1,"metadata");
 var h=slides[i].querySelector(".bjh");if(i>0)document.querySelectorAll(".bjh").forEach(function(x){x.style.opacity=0});
 play(i);icons();
}
function play(i){
 var v=vid(i);if(!v)return;v.muted=!sound;
 var p=v.play();
 if(p&&p.catch)p.catch(function(err){if(!err||err.name!=="NotAllowedError")return;v.muted=true;sound=false;icons();var q=v.play();if(q&&q.catch)q.catch(function(){})});
}
function icons(){host.querySelectorAll("[data-bm]").forEach(function(b){b.textContent=sound?"🔊":"🔇"})}
function flash(s,t){var f=s.querySelector(".bjf");f.textContent=t;f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}
function goto(d){var i=Math.max(0,Math.min(slides.length-1,(act<0?0:act)+d));host.scrollTo({top:slides[i].offsetTop,behavior:"smooth"})}
host.addEventListener("click",function(e){
 var b=e.target.closest("button");
 if(b){
  if(b.dataset.bm){sound=!sound;var v=vid(act);if(v){v.muted=!sound;if(v.paused)play(act)}icons()}
  else if(b.dataset.bs){var i=act<0?0:act,u=location.origin+location.pathname,tx=ttl(i)+" 🙏";
   if(navigator.share){navigator.share({title:tx,text:tx,url:u}).catch(function(){})}
   else window.open("https://wa.me/?text="+encodeURIComponent(tx+" "+u),"_blank","noopener")}
  else if(b.dataset.bn)goto(+b.dataset.bn);
  return}
 var s=e.target.closest(".bj");if(!s)return;var v=s.querySelector("video");if(!v||!v.getAttribute("src"))return;
 if(v.paused){play(+s.dataset.i);flash(s,"▶")}else{v.pause();flash(s,"⏸")}
});
addEventListener("keydown",function(e){if(!sec.classList.contains("on")||sec.classList.contains("hubm"))return;
 if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();goto(1)}else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();goto(-1)}else if(e.key===" "){e.preventDefault();var v=vid(act);if(v)v.paused?play(act):v.pause()}});
function stopAll(){slides.forEach(function(s,k){if(vid(k))vid(k).pause()})}
function omPause(on){
 document.body.classList.toggle("bjon",on);
 try{if(typeof BG==="undefined")return;
  if(on){bgHold=true;if(!BG.paused)BG.pause()}
  else{bgHold=false;if(bgWant&&BG.paused){BG.volume=0;var p=BG.play();if(p&&p.then)p.then(function(){bgFade(.7,1200)},function(){})}}}catch(e){}
}
var wasOn=false;
new MutationObserver(function(){
 var on=sec.classList.contains("on");if(on!==wasOn){wasOn=on;omPause(on)}
 if(sec.classList.contains("on")&&!sec.classList.contains("hubm")){navH();build();if(slides.length){var i=act<0?lastIdx:act;act=-1;if(slides[i]){host.scrollTop=slides[i].offsetTop;setActive(i)}}}
 else{stopAll();act=-1}
}).observe(sec,{attributes:true,attributeFilter:["class"]});
document.addEventListener("visibilitychange",function(){if(document.hidden)stopAll();else if(sec.classList.contains("on")&&act>=0){var i=act;act=-1;setActive(i)}});
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){if(built&&slides.length)titles()})});
if(sec.classList.contains("on"))build();
})();
</script>
